name: Sightline
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: "" # your Apple Team ID: set it here or run with DEVELOPMENT_TEAM=... 
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Sightline:
    type: application
    platform: iOS
    sources:
      - path: Sightline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.findmyteam # must be unique to your Apple team (change "example")
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Sightline/Info.plist
      properties:
        CFBundleDisplayName: FindMyTeam
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        NSCameraUsageDescription: FindMyTeam uses the camera to track your position and map walls so your incident commander can see you.
        NSLocalNetworkUsageDescription: FindMyTeam talks to the incident commander's laptop on this Wi-Fi network.
        NSMotionUsageDescription: FindMyTeam uses motion sensing to recognise walking, stillness and falls so the commander is alerted if you go down.
        # No ATS exceptions for arbitrary loads: all traffic is TLS, pinned to the server certificate.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
